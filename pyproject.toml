[project]
name = "inbox-da"
version = "0.1.0"
description = "DeepAgent financial inbox monitor with SQLite, Gemini, and verified structured extraction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.3.3",
    "fastapi>=0.124.0",
    "jinja2>=3.1.0",
    "langchain>=1.1.0",
    "langchain-google-genai>=4.0.0",
    "openpyxl>=3.1.5",
    "oracledb>=3.0.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.0",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "reportlab>=4.4.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
inbox-da = "inbox_da.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inbox_da = ["schema.sql", "templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
